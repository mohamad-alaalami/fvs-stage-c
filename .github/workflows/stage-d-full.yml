        run: python staged/run.py --records stage-c-records --index index.json --build results/runs/${{ inputs.build_run }}/build/attempt-1 --out chunk-output --chunk ${{ matrix.chunk }}
      - name: Preserve records even after a failure
        if: always()
        shell: bash
        run: |
          if [ -d chunk-output ]; then bash staged/publish.sh "$PWD/chunk-output" "runs/${GITHUB_RUN_ID}/chunks/${{ matrix.chunk }}/attempt-${GITHUB_RUN_ATTEMPT}" "Stage D chunk ${{ matrix.chunk }} ${GITHUB_RUN_ID}"; fi
  report:
    needs: [arms1, arms2, arms3]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: stage-d-results
          path: results
          sparse-checkout: runs/${{ github.run_id }}
      - name: Regenerate indexed censored comparisons
        run: |
          python3 -c "import pathlib,zlib; pathlib.Path('index.json').write_bytes(zlib.decompress(pathlib.Path('staged/index.json.zz').read_bytes()))"
          python3 staged/report.py index.json results/runs/${GITHUB_RUN_ID} report-output
          cat report-output/REPORT.md >> "$GITHUB_STEP_SUMMARY"
          bash staged/publish.sh "$PWD/report-output" "runs/${GITHUB_RUN_ID}/report/attempt-${GITHUB_RUN_ATTEMPT}" "Stage D report ${GITHUB_RUN_ID}"
