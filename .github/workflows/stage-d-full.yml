  arms3:
    needs: arms2
    if: always()
    runs-on: windows-2025
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        chunk: [370, 371, 372, 373, 374, 375, 376, 377, 378, 379, 380, 381, 382, 383, 384, 385, 386, 387, 388, 389, 390, 391, 392, 393, 394, 395, 396, 397, 398, 399, 400, 401, 402, 403, 404, 405, 406, 407, 408, 409, 410, 411, 412, 413, 414, 415, 416, 417, 418, 419, 420, 421, 422, 423, 424, 425, 426, 427, 428, 429, 430, 431, 432, 433, 434, 435, 436, 437, 438, 439, 440, 441, 442, 443, 444, 445, 446, 447, 448, 449, 450, 451, 452, 453, 454, 455, 456, 457, 458, 459, 460, 461, 462, 463, 464, 465, 466, 467, 468, 469, 470, 471, 472, 473, 474, 475, 476, 477, 478, 479, 480, 481, 482, 483, 484, 485, 486, 487, 488, 489, 490, 491, 492, 493, 494, 495, 496, 497, 498, 499, 500, 501, 502, 503, 504, 505, 506, 507, 508, 509, 510, 511, 512, 513, 514, 515, 516, 517, 518, 519, 520, 521, 522, 523, 524, 525, 526, 527, 528, 529, 530, 531, 532, 533, 534, 535, 536, 537, 538, 539, 540, 541, 542, 543, 544, 545, 546, 547, 548, 549, 550, 551, 552, 553, 554]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: eece4cfe803a97c47ca178c14caa6b71b1e962c3
          path: stage-c-records
          sparse-checkout: runs/44639720515
      - uses: actions/checkout@v4
        with:
          ref: stage-d-results
          path: results
          sparse-checkout: runs/${{ inputs.build_run }}/build/attempt-1
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Unpack validated index
        shell: pwsh
        run: python -c "import pathlib,zlib; pathlib.Path('index.json').write_bytes(zlib.decompress(pathlib.Path('staged/index.json.zz').read_bytes()))"
      - name: Check immutable build revision
        shell: pwsh
        run: |
          $b = Get-Content results/runs/${{ inputs.build_run }}/build/attempt-1/build.json | ConvertFrom-Json
          if ($b.experiment_commit -ne $env:GITHUB_SHA) { throw 'pilot build revision differs from experiment revision' }
